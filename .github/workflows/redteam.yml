# Replays real attack techniques against a deployed stack and fails if Tripwire stays quiet.
# Run only against a throwaway sandbox account. Needs an OIDC role in that account (secrets.AWS_ROLE_ARN).
name: redteam
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  stratus:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TECHNIQUES: >-
        aws.discovery.ec2-enumerate-from-instance
        aws.credential-access.secretsmanager-retrieve-secrets
        aws.persistence.iam-create-admin-user
        aws.defense-evasion.cloudtrail-stop
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go install github.com/datadog/stratus-red-team/v2/cmd/stratus@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: detonate
        run: |
          date -u +%s > started
          for t in $TECHNIQUES; do stratus detonate "$t"; done
      - name: expect an incident within 10 minutes
        run: python -m scripts.check_incident --since "$(cat started)" --timeout 600
      - name: clean up
        if: always()
        run: for t in $TECHNIQUES; do stratus cleanup "$t" || true; done
